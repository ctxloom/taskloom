[workspace]
resolver = "2"
members = ["crates/*/*/*"]

[workspace.package]
edition = "2021"
# The newest any dependency needs: yaml-rt-core (tasks-config) needs 1.96,
# rmcp (tasks-mcp, and the binary through it) 1.88.
rust-version = "1.96"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
# prost must be the version angzarr-proto generates for, so ctxloom's
# messages and angzarr's are built by one prost.
prost = "0.14"
prost-types = "0.14"
angzarr-proto = { version = "0.1", git = "https://github.com/angzarr-io/angzarr-project", rev = "672ed768aa1c8a8e05818c457c757cd406105e55" }

# annals and angzarr-build (angzarr-cli's `rust-cli` branch) are pinned by
# full commit, so a fresh clone builds with no sibling checkouts; bumps are
# deliberate commits. To build against local checkouts while changing them
# together, see "Co-developing annals, angzarr-cli or tagma" in CLAUDE.md.
annals = { git = "https://github.com/benjaminabbitt/annals", rev = "ed00923e915c7fc9b832eba30d32115168ab7c35" }
annals-diagnostic = { git = "https://github.com/benjaminabbitt/annals", rev = "ed00923e915c7fc9b832eba30d32115168ab7c35" }
angzarr-build = { git = "https://github.com/angzarr-io/angzarr-cli", rev = "0277731bc9b5e46596633da9786fd5b5e6e993f2" }

# angzarr-embedded, angzarr's in-app runtime, which taskloom is moving onto
# from annals (taskloom-on-angzarr-embedded.plan.md; the annals pins above
# stay until the rest of the workspace moves, step 3). Pinned by rev on
# angzarr-embedded's main: 550052a (router fc6d3a6, spec a0be938: angzarr-ports'
# StoreError Display quotes ambiguous values).
angzarr-embedded = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "550052a30c5c59a106ba99f0f6df8440b456c82e" }
angzarr-embedded-macros = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "550052a30c5c59a106ba99f0f6df8440b456c82e" }
angzarr-embedded-diagnostic = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "550052a30c5c59a106ba99f0f6df8440b456c82e" }
angzarr-store-sqlite = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "550052a30c5c59a106ba99f0f6df8440b456c82e" }
# angzarr's storage contract, at the spec rev angzarr-embedded pins
# (a0be938), so the embedded side of the graph holds one spec: its
# in-memory store, for the domain's tests. angzarr-embedded brings
# angzarr-proto at the same rev; the workspace's angzarr-proto above stays
# at annals' until step 3.
angzarr-ports = { git = "https://github.com/angzarr-io/angzarr-project", rev = "a0be9386a8e535141dea3a5c27499e838ec6abc8" }
tasks-proto = { path = "crates/core/wire/tasks-proto" }
annals-store-sql = { git = "https://github.com/benjaminabbitt/annals", rev = "ed00923e915c7fc9b832eba30d32115168ab7c35", features = ["sqlite"] }
tasks = { path = "crates/core/domain/tasks" }
task-lists = { path = "crates/core/read-model/task-lists" }
task-priority = { path = "crates/core/read-model/task-priority" }
ports = { path = "crates/core/ports/ports" }
tasks-application = { path = "crates/core/application/tasks-application" }
project-application = { path = "crates/core/application/project-application" }
registration-application = { path = "crates/core/application/registration-application" }
project-registry = { path = "crates/adapters/driven/project-registry" }
harp-names = { path = "crates/adapters/driven/harp-names" }
task-store-sqlite = { path = "crates/adapters/driven/task-store-sqlite" }
jsonl-task-log = { path = "crates/adapters/driven/jsonl-task-log" }
tasks-config = { path = "crates/adapters/driven/tasks-config" }
agent-configs = { path = "crates/adapters/driven/agent-configs" }
file-system = { path = "crates/adapters/platform/file-system" }
file-lock = { path = "crates/adapters/platform/file-lock" }
os = { path = "crates/adapters/platform/os" }
system = { path = "crates/adapters/driven/system" }
tasks-cli = { path = "crates/adapters/driving/tasks-cli" }
tasks-lib = { path = "crates/root/lib/tasks-lib" }
presentation = { path = "crates/adapters/driving/presentation" }
tasks-presentation = { path = "crates/adapters/driving/tasks-presentation" }
tasks-mcp = { path = "crates/adapters/driving/tasks-mcp" }
tasks-watch = { path = "crates/adapters/driving/tasks-watch" }
project-cli = { path = "crates/adapters/driving/project-cli" }
registration-cli = { path = "crates/adapters/driving/registration-cli" }

# tagma: the tag grammar and query engine (tagma-core) and its Tag message
# (tagma-proto), pinned by full commit; bumps are deliberate commits.
tagma-core = { git = "https://github.com/benjaminabbitt/tagma", rev = "c5ecbbdfafaf2fba42357fff88875a2b47e2e149" }
tagma-proto = { git = "https://github.com/benjaminabbitt/tagma", rev = "c5ecbbdfafaf2fba42357fff88875a2b47e2e149" }

# Task and project ids: harp's word lists, as Go's harp ports them.
harp-core = { git = "https://github.com/benjaminabbitt/harp", rev = "21648c9712ab60a84b609e1321201f158203a4bc" }

# Third-party, for the adapters and the composition root.
clap = { version = "4.5", features = ["derive"] }
# The edge's message catalogs: Fluent's standard runtime and its language ids.
fluent-bundle = "0.15"
fluent-syntax = "0.11"
fs4 = "1.1"
# `#[mutants::skip]`, for a mutant judged equivalent. The core takes it as a
# dev-dependency, behind `cfg_attr(test, ...)`, so it links nothing new.
mutants = "0.0.4"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml's maintained fork: serde_yaml's libyaml is unmaintained (RustSec).
serde_norway = "0.9"
# Editing a config file in place, its comments and layout kept: the
# tag_permits block `taskloom permit` and `revoke` change. No dependencies of
# its own; it needs Rust 1.96. serde_norway stays the reader, and every edit
# is read back with it before it is written. Pinned exactly: 0.3.2.
yaml-rt-core = "=0.3.2"
sha2 = "0.10"
tempfile = "3"
# The file-system seam on Windows: directory links as junctions (as Go's
# ctxloom makes them), and file identity by volume and file index. Pinned
# exactly: junction at 2.1.0 (2026-09-24), the newest release at least two
# weeks old when chosen (2026-10-22); same-file at 1.0.6 (2020-01-11).
junction = "=2.1.0"
same-file = "=1.0.6"
# The os crate's Windows console calls (a Ctrl-Break sent to a child's
# process group, in tests). Pinned exactly, at 0.61.2 (2025-10-06), the
# version tokio already brings in.
windows-sys = "=0.61.2"
# The os crate's path logic for every flavor on every host: Windows paths
# parsed on Linux, so their display and comparison keys are tested here.
# Pinned exactly, at 0.12.3 (2026-02-11): 0.12.4 and 0.13.0 (2026-10-20)
# were under two weeks old when it was chosen (2026-10-26). MIT OR
# Apache-2.0; no dependencies.
typed-path = "=0.12.3"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["rt", "time"] }
unic-langid = "0.9"
# The MCP server's protocol and stdio transport: the official Rust MCP SDK.
# Pinned exactly, at 3.5.1 (2026-10-05): the newest release at least two
# weeks old when it was chosen (2026-10-21). Only the server and its
# stdio transport; no macros, so no schema is derived from Rust types (the
# tools' schemas are Go's, copied verbatim).
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
# Priority's formula evaluator: expr-lang's Rust port, so the formulas Go's
# expr-lang evaluates mean the same here. Pinned exactly, at 2.1.0
# (2026-08-21). No default features: the formulas are arithmetic, and the
# rest (time zones, JSON, regex) would link crates they never use.
expr-lang = { version = "=2.1.0", default-features = false }
# Display-width columns in text output.
unicode-width = "0.2"
uuid = { version = "1", features = ["v5", "v7"] }

[workspace.lints.clippy]
invisible_characters = "deny"
unicode_not_nfc = "deny"
non_ascii_literal = "deny"
# Complexity, at clippy's defaults except nesting, whose threshold is in
# clippy.toml (and crates/core/clippy.toml, which shadows it there).
cognitive_complexity = "warn"
too_many_lines = "warn"
excessive_nesting = "warn"
