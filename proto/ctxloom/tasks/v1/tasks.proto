syntax = "proto3";

// One task is one aggregate: its stream's root is derived from its harp id
// (`ids::compute_root("tasks", harp_id)`), in its project's store. A harp id
// is therefore unique because a stream is: adding to a stream that already
// holds a task is refused, and a removed task's stream keeps its harp
// reserved, unless a prune removed it: a prune then purges the stream,
// freeing the harp.
package ctxloom.tasks.v1;

import "google/protobuf/timestamp.proto";
import "io/angzarr/v1/options.proto";
import "tagma/v1/tag.proto";

// The task, folded from its events. Derived values (whether the status is
// terminal, the text hash, a priority) are computed when read, never stored.
message TaskState {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_AGGREGATE
    domain: "tasks"
    name: "Task"
  };

  // The task's identity ("swift-amber"): what humans and references use.
  string harp_id = 1;
  string text = 2;
  // A status name. The taxonomy (To Do, In Progress, Deferred, Done,
  // Archived) is the default set, not a closed one.
  string status = 3;
  // The revive condition of a Deferred task: a task holds one exactly while
  // it is Deferred. Setting one defers the task; clearing it, or moving the
  // task to another status, revives it.
  string trigger = 4;
  // The session that created the task, if one did.
  string origin_session = 5;
  // Normalized: unique, sorted by their canonical spelling.
  repeated tagma.v1.Tag tags = 6;
  google.protobuf.Timestamp created_at = 7;
  // When the status last changed (the add counts).
  google.protobuf.Timestamp status_set_at = 8;
  // When the task last entered Deferred; absent until it first does.
  optional google.protobuf.Timestamp deferred_since = 9;
  // Removed tasks keep their stream and their harp id, until a prune's
  // removal is followed by its purge.
  bool removed = 10;
  // The status the task returns to when its trigger is cleared: the one it
  // held when it was deferred (the initial status, for a task added
  // Deferred). Empty exactly while the task is not Deferred.
  string prior_status = 11;
}

// region commands
//
// A command that can defer a task carries the statuses that rule it, which
// the application resolves from the configured taxonomy, so the domain
// names none: `defers`, the status a trigger defers a task to, the one
// that needs a trigger; and `initial`, the status a task gets when none is
// given (and returns to, cleared of the trigger it was added Deferred
// with). Both are required (refused empty: tasks-unresolved).

// Create the task. The harp id is minted by the caller (minting is random,
// and decide is deterministic); a stream that already holds a task refuses
// it, and the caller mints another.
message AddTask {
  option (io.angzarr.v1.command) = {
    component: "ctxloom.tasks.v1.TaskState"
    emits: ["ctxloom.tasks.v1.TaskAdded"]
  };

  string harp_id = 1;
  string text = 2;
  // Left out, `initial`. Given, never blank.
  optional string status = 3;
  // Given (never blank), the task is added `defers`, returning to `initial`
  // when the trigger is cleared. Required when status is `defers`; refused
  // with any other status (tasks-trigger-with-status).
  optional string trigger = 4;
  repeated tagma.v1.Tag tags = 5;
  // Left out, none. Given, never blank.
  optional string origin_session = 6;
  string defers = 7;
  string initial = 8;
}

// Change the task's status, its trigger, or both; at least one is given.
// `defers` is Deferred below, and `initial` To Do, as the default taxonomy
// names them.
//
// A trigger given (never blank) defers the task, replacing any held: its
// status becomes Deferred, and the status it held is kept to return to (a
// Deferred task keeps the one it has). Given with a status, the status
// must be Deferred (tasks-trigger-with-status).
//
// A trigger given EMPTY clears the one held: a Deferred task returns to the
// status it was deferred from, or to `status`,
// when one is given (Deferred is refused: tasks-trigger-required).
// Clearing a trigger the task does not hold changes nothing.
//
// A trigger left out keeps the one held while the task stays Deferred.
// Moving to Deferred needs a trigger, given here or held; moving to any
// other status clears it, so a task holds a trigger exactly while it is
// Deferred.
message SetStatus {
  option (io.angzarr.v1.command) = {
    component: "ctxloom.tasks.v1.TaskState"
    emits: ["ctxloom.tasks.v1.StatusChanged"]
  };

  // Given, never blank.
  optional string status = 1;
  optional string trigger = 2;
  string defers = 3;
  string initial = 4;
}

// Replace the task's text whole.
message EditText {
  option (io.angzarr.v1.command) = {
    component: "ctxloom.tasks.v1.TaskState"
    emits: ["ctxloom.tasks.v1.TextEdited"]
  };

  string text = 1;
}

// Add and remove tags in one change. Both lists are final: a tag schema's
// scalar collapse (a new `priority=high` displacing `priority=low`) is
// resolved by the caller before the command is sent, so decide never reads
// the schema.
message Retag {
  option (io.angzarr.v1.command) = {
    component: "ctxloom.tasks.v1.TaskState"
    emits: ["ctxloom.tasks.v1.Retagged"]
  };

  repeated tagma.v1.Tag add = 1;
  repeated tagma.v1.Tag remove = 2;
}

message RemoveTask {
  option (io.angzarr.v1.command) = {
    component: "ctxloom.tasks.v1.TaskState"
    emits: ["ctxloom.tasks.v1.TaskRemoved"]
  };

  RemovalReason reason = 1;
}

enum RemovalReason {
  REMOVAL_REASON_UNSPECIFIED = 0;
  // Removed by name.
  REMOVAL_REASON_REMOVED = 1;
  // Taken by a prune: a selection by status, age and tags.
  REMOVAL_REASON_PRUNED = 2;
}

// endregion commands

// region events

// An event carries the values the task holds after it, not the change that
// led there: apply assigns them and computes nothing, so folding an event
// needs no rule and no prior state, and a consumer reads it whole.
//
// Every timestamp an event carries is the instant it was recorded
// (`Tx::recorded_at`), copied in because apply never sees the event's
// metadata and the state keeps these instants.

message TaskAdded {
  option (io.angzarr.v1.event) = {component: "ctxloom.tasks.v1.TaskState"};

  string harp_id = 1;
  string text = 2;
  string status = 3;
  string trigger = 4;
  // Normalized.
  repeated tagma.v1.Tag tags = 5;
  string origin_session = 6;
  google.protobuf.Timestamp at = 7;
  // `at` when the task is added Deferred; absent otherwise.
  optional google.protobuf.Timestamp deferred_since = 8;
  // The status clearing its trigger returns it to, when it is added
  // Deferred; empty otherwise.
  string prior_status = 9;
}

message StatusChanged {
  option (io.angzarr.v1.event) = {component: "ctxloom.tasks.v1.TaskState"};

  string status = 1;
  // The trigger the task holds after the change, changed or not.
  string trigger = 2;
  google.protobuf.Timestamp at = 3;
  // `at` when the task enters Deferred; otherwise the instant it last did,
  // absent if it never has.
  optional google.protobuf.Timestamp deferred_since = 4;
  // The status the task returns to when its trigger is cleared, after the
  // change: empty unless it is Deferred.
  string prior_status = 5;
}

message TextEdited {
  option (io.angzarr.v1.event) = {component: "ctxloom.tasks.v1.TaskState"};

  string text = 1;
}

// Recorded only when the retag changes the task's tags.
message Retagged {
  option (io.angzarr.v1.event) = {component: "ctxloom.tasks.v1.TaskState"};

  // The task's tags after the retag, normalized.
  repeated tagma.v1.Tag tags = 1;
}

message TaskRemoved {
  option (io.angzarr.v1.event) = {component: "ctxloom.tasks.v1.TaskState"};

  RemovalReason reason = 1;
}

// endregion events
