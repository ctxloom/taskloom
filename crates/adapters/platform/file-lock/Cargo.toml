[package]
name = "file-lock"
version = "0.1.0"
description = "ctxloom's advisory file locks, as Go ctxloom takes them: flock on a lock file, re-checked against the file at its path, waited for a bounded time; and the home sidecar (with its reap interlock) that guards a file ctxloom does not own"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-embedded-diagnostic.workspace = true
file-system.workspace = true
# The advisory lock itself, and how a lock file records a path, per OS.
os.workspace = true
sha2.workspace = true

[dev-dependencies]
# Rendering catalogs' English, for the tests that hold it to Go's.
fluent-bundle.workspace = true
fluent-syntax.workspace = true
mutants.workspace = true
os = { workspace = true, features = ["test-support"] }

[features]
# `diagnostic_samples`, for other crates' catalog tests: their
# dev-dependency turns it on, and no build of a binary does.
test-support = []

[lints]
workspace = true
