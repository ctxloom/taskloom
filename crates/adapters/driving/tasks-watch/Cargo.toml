[package]
name = "tasks-watch"
version = "0.1.0"
description = "taskloom watch: a project's task changes as a JSON Lines stream, debounced, from the watch use case"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-embedded-diagnostic.workspace = true
clap.workspace = true
# Flavor: what the help says stops the watch (Ctrl-C and SIGTERM, or on
# Windows Ctrl-C, Ctrl-Break and the console's close, logoff or shutdown).
os.workspace = true
presentation.workspace = true
serde.workspace = true
tasks-application.workspace = true
tokio.workspace = true

[dev-dependencies]
# Rendering catalogs' English, for the tests that hold it to Go's.
fluent-bundle.workspace = true
fluent-syntax.workspace = true
serde_json.workspace = true

[features]
# `diagnostic_samples`, for other crates' catalog tests: their
# dev-dependency turns it on, and no build of a binary does.
test-support = []

[lints]
workspace = true
