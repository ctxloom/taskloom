[package]
name = "project-cli"
version = "0.1.0"
description = "The project command group (show, heal, repoint, orphans), for any binary to mount: arguments parsed into the project use cases, and their answers rendered as text or JSON"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-embedded-diagnostic.workspace = true
clap.workspace = true
presentation.workspace = true
project-application.workspace = true
serde.workspace = true

[dev-dependencies]
# Rendering catalogs' English, for the tests that hold it to Go's.
fluent-bundle.workspace = true
fluent-syntax.workspace = true
serde_json.workspace = true
project-application = { workspace = true, features = ["test-support"] }

[features]
# `diagnostic_samples`, for other crates' catalog tests: their
# dev-dependency turns it on, and no build of a binary does.
test-support = []

[lints]
workspace = true
