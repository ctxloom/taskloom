[package]
name = "presentation"
version = "0.1.0"
description = "Presentation at the driving edge, for any domain: JSON or UTF-8 text, diagnostics rendered from Fluent catalogs, display-width text helpers"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Domain-free: no ctxloom crate but the diagnostics crates, which
# lib.test.rs checks (annals-diagnostic until step 4, then
# angzarr-embedded-diagnostic alone).
[dependencies]
annals-diagnostic.workspace = true
# Its quoting, so a diagnostic no catalog knows is shown as its key and
# args exactly as angzarr-embedded's display them; the trait it renders
# moves here from annals-diagnostic with step 4.
angzarr-embedded-diagnostic.workspace = true
fluent-bundle.workspace = true
serde.workspace = true
serde_json.workspace = true
unic-langid.workspace = true
unicode-width.workspace = true

[dev-dependencies]
fluent-syntax.workspace = true

[lints]
workspace = true
