[package]
name = "tasks-mcp"
version = "0.1.0"
description = "The tasks MCP server: the task tools and tag resources over stdio, translated into the application's use cases"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-embedded-diagnostic.workspace = true
clap.workspace = true
presentation.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tasks-application.workspace = true
tasks-presentation.workspace = true
tokio.workspace = true

[dev-dependencies]
# Rendering catalogs' English, for the tests that hold it to Go's.
fluent-bundle.workspace = true
angzarr-ports = { workspace = true, features = ["memory"] }
fluent-syntax.workspace = true
mutants.workspace = true
ports.workspace = true
# In-memory duplex pipes stand in for stdio in the server's tests, and a
# oneshot holds a call open; rmcp's transport turns both on already.
tokio = { workspace = true, features = ["io-util", "sync"] }

[features]
# `diagnostic_samples`, for other crates' catalog tests: their
# dev-dependency turns it on, and no build of a binary does.
test-support = []

[lints]
workspace = true
