# taskloom's own loadout — what taskloom contributes to a ctxloom session,
# emitted by `taskloom loadout --format yaml` as a loadout DOCUMENT: `run:` is the bundles.Bundle a session consumes
# every time; a typed `init:` section (setup_guidance, tooling,
# legacy_context, questions) is consumed once at setup — taskloom declares
# none today. ctxloom discovers this binary on PATH, execs the loadout
# command, and seeds the RUN bundle under the ctxloom:companion@taskloom
# source ref — same shape a remote bundle takes. This file is the single
# source of truth
# for what taskloom tells ctxloom about itself.

run:
  version: 2.0.0
  tags:
    - tasks
    - workflow
    - productivity
    - ctxloom-native
  author: taskloom

  description: |
    Persistent task tracking via the standalone `taskloom` binary
    (built from github.com/ctxloom/taskloom, crates/root/bin/taskloom). Tasks live in a per-project append-only log
    at ~/.ctxloom/projects/<project-id>/state.db keyed by harp IDs and are managed
    through the `taskloom` CLI alone (it serves no MCP). Also stamps the active session's harp name
    into plan files as they're edited. Write task text subject-first: the
    first line is what the task IS (list views show only that line,
    truncated at 80 characters); provenance goes on a later line.

  notes: |
    This bundle ships two ctxloom hooks:

      1. SessionStart → ctxloom hook session-bind
         Records the backend session_id ↔ harp mapping in
         the session's record so resume and the transcript capture can
         find the session.

      2. PostFileEdit → taskloom manage hook stamp-plan
         Records the active session's harp name in a plan file's (`*.plan.md`)
         YAML frontmatter `sessions:` list; taskloom is the one writer of
         that key. Plans and sessions cross-reference automatically.

  installation: |
    «HUMAN: how the Rust taskloom binary is installed; it has no install channel yet.»
    Then start a `ctxloom run` session (it delivers the hooks
    into its own session home), or run `ctxloom materialize --yes` to write
    them into the project's own engine files. The
    hooks are safe to install before session harp-naming is active (stamp-plan
    no-ops when CTXLOOM_SESSION_HARP is unset). Without ctxloom, put
    `taskloom` on PATH: the CLI needs no registering.

  hooks:
    session_start:
      # Fires once per backend session with the session id and transcript
      # path in the JSON payload. ctxloom hook session-bind reads those,
      # looks up CTXLOOM_SESSION_HARP from env, and records the mapping in
      # the session's record. This is the bind path — resume and the
      # transcript capture rely on the resulting record.
      #
      # pre_tool_fallback: the bind is first-bind-wins idempotent, so on
      # agents without a session-start event it may fire on
      # PreToolUse instead — the session binds at the first tool call.
      - command: ctxloom
        args: [hook, session-bind]
        type: command
        pre_tool_fallback: true
    post_file_edit:
      # No tool class: post_file_edit is already post_tool narrowed to the
      # file_edit class, which each engine maps to its own file-editing
      # tools. Plan-file filtering happens inside stamp-plan (a file named
      # *.plan.md) so the hook is cheap to install on every edit.
      - command: taskloom
        args: [manage, hook, stamp-plan]
        type: command

  fragments:
    taskloom:
      premise: You are about to create, read, update or close a task, judge whether
        something already tracked covers the work in front of you, or decide whether a
        finding should become a row at all. For anyone reaching for the task log, however
        the moment is worded.
      tags:
        - tasks
        - ctxloom
      content: |
        # taskloom

        Persistent task tracking. Tasks live in a per-project append-only log
        (~/.ctxloom/projects/<project-id>/state.db) and are keyed by harp IDs
        (e.g. `swift-amber-falcon`). Statuses: `In Progress`, `To Do`,
        `Deferred`, `Done`, `Archived`.

        ## The CLI is the only surface

        taskloom serves no MCP. Commands are `taskloom <noun> <verb>`. Read
        with `tasks list` (`--term`, `--tag-query`, `--status`, `--all`,
        `--compact`, `--limit`), `tasks show <harp>...`, `tasks summary`,
        `manage schema tags list`, `manage schema permits list` and `manage
        schema show`; write with `tasks add <text>` (`--tag`, `--status`,
        `--trigger`), `tasks set <harp>` (`--text`, `--status`, `--trigger`)
        and `tasks tag add|remove <harp> <tag>`. A bare group (`taskloom
        tasks`) prints its help, as `<command> --help` does: that is the
        reference. There is no `help` command. Echo a task's harp back when
        you name it later.

        - `--tag-query` is POSTFIX: tags first, operator after
          (`human:decision/area:cli/and`, `human:decision/not`).
        - Enumerate with `--compact` and/or `--limit`: a bare `tasks list
          --format json` returns every task's whole body.
        - A command's stderr may carry DEAD LETTER lines: each almost
          certainly marks a taskloom bug, so show them to the user.
        - Never read the store (`state.db`) directly: it is an append-only
          log, and only the CLI folds it to current state.
        - The old spellings (`taskloom list`, `add`, `show`, `status`, `edit`,
          `tag`, `tags`, `summary`, `lint`, `prune`, `schema`, `plan`,
          `watch`, and the old json shorthand flag) are removed, not aliased: each
          prints `removed: use <new command>` and exits 2.
        - Exit codes: 0 success; 1 the command ran against the store and the
          answer was negative (no such task, a `check` finding); 2 the
          request is invalid on its own content (bad arguments, a tag no
          permit admits) and nothing was read or written.

        ## Use `--format json` FIRST, paired with jq — on every command

        EVERY taskloom command takes `--format json` (`--format` also accepts
        text; there is no shorthand flag). If you are an agent,
        `--format json` is your surface — reach for it before anything else, and pipe it
        through jq. The default text output is for a person reading a terminal.

            # one task's exact body — no header to strip, no offset to guess.
            # A GROUP serializes as a LIST and a SINGLE value as an OBJECT, so
            # one id is a bare object and several are an array. The shape
            # follows what you ASKED FOR, not what was found.
            taskloom tasks show <harp> --format json | jq -r '.text'
            taskloom tasks show <harp-a> <harp-b> --format json | jq -r '.[].text'

            # every harp; every harp carrying a tag
            taskloom tasks list --all --format json | jq -r '.[].harp_id'
            taskloom tasks list --all --format json | jq -r '.[]|select(.tags[]?=="human:decision")|.harp_id'

        **If `--format json` fails, or a field you need is missing from it, REPORT THAT
        as a defect** — then route around it if you must to finish the job. Both,
        not either. The workaround unblocks you; the report is what gets the gap
        closed, and it is the half that gets skipped.

        This matters more here than it would for a third-party tool: taskloom,
        ctxloom and reprise are ours, and we are their alpha users. There is no
        upstream to file against and no other user base to hit the gap first. A
        missing field that nobody reports simply stays missing, and the next agent
        pays the same tax — which is exactly how the text-scraping habit took hold
        instead of anyone noticing every command already speaks JSON.

        Why this is stated so firmly: every way text-parsing breaks here produces a
        WRONG ANSWER rather than an error.

        - `taskloom tasks show`'s text form prints a multi-line header. Capturing a body
          by dropping a fixed number of lines can leave a `tags:` line as line 1 —
          and line 1 IS the subject, so a following `tasks set --text` (which replaces the
          whole text) silently renames the task.
        - In `--compact` rows, `[x]` is one field but `[ ]` is two, so a positional
          field split drops every OPEN task and keeps only the closed ones. The
          output looks well-formed and is wrong in exactly one direction.

        `--status` is singular (repeat it), and `--all` is what shows finished
        and Deferred tasks. A mistyped flag
        errors, but a mis-scoped query returns a confident empty list — confirm the
        flag exists before believing emptiness.

        ## Check the log before you start, and again before you finish

        **Before starting work**, look for open tasks that touch what you are
        about to change. One may already hold the root cause, a decision
        someone already made, or a constraint you would otherwise rediscover
        the hard way — and it may show that someone else is mid-flight in the
        same files. Search by AREA, not just by title, since a task about your
        code may be named for its symptom:

            taskloom tasks list --term <symbol, path, or error string>
            taskloom tasks list --tag-query <area>

        **Before finishing**, scan again for tasks in the same area. If your
        change satisfies one, say so and offer to close it — quote what the
        task asked for and what you actually did, so the reader can judge
        rather than take your word. If it satisfies a task only in part, edit
        the task down to what REMAINS: record only what is still to do. A
        task carrying its own finished half reads as work never started.

        `taskloom tasks prune` removes old finished tasks from the log for good (by
        default Done tasks whose last status change is over 7 days old); without
        `--yes` it only reports. It is the human's housekeeping call: never run
        `taskloom tasks prune --yes` unless asked, and never in place of closing or
        archiving a task.

        ## Do NOT create a task on your own initiative

        A task is created with the user's agreement, never as a side effect of
        you noticing something. PROPOSE it — say what you found and what you
        think should happen — and create the row once they accept. Work is
        meant to be planned and accepted, then pulled in later, fleshed out,
        and acted on.

        This reverses the older instinct to capture everything. That instinct
        produced 163-309 new tasks a week for eight weeks, and the open pile is
        now as large as everything ever completed. A backlog that size is not a
        record of intent; it is a search cost paid by everyone who opens it.
        Note also what the log cannot tell you: a task record carries only
        `created_at` and no completion timestamp, so whether the queue is
        keeping up is not a computable question. The size of the pile is the
        only signal there is, and it says stop.

        Surfacing is NOT filing. Deferred work must still never vanish silently
        at the end of a session — but the way it survives is that you TELL THE
        USER, in your reply, plainly enough for them to act on. They decide
        what becomes a row.

        ## Do it, do not file it

        Before proposing anything, apply this test. It is a test rather than an
        effort estimate because nobody can calibrate an estimate:

          - you have ALREADY root-caused it, AND
          - the fix touches code you have ALREADY read, AND
          - the fast gates settle it — `just build && just lint &&
            just test-pkg <pkg>`, roughly 35 seconds

        All three true? DO IT NOW. Filing instead converts a solved problem
        into work someone pays to rediscover: they must re-read the code,
        rebuild the reproduction, and re-derive the cause you already had in
        hand. A filed task looks like progress. It is a promise.

        ## Propose one only when the work genuinely cannot happen now

        Exactly three reasons qualify:

          - it needs a HUMAN DECISION — then name the fork and the options
          - it lives in ANOTHER REPO or another RELEASE
          - it is MATERIALLY LARGER than the current turn

        "I noticed several things" is not one of them.

        ONE issue per task. A row carrying two questions gets one of them
        answered and the other silently dropped; a row carrying a question AND
        the work it gates cannot be closed without lying about one half. If you
        are about to write "and also", propose two, each naming the other.

        LOOK BEFORE YOU PROPOSE. Search by AREA and by SYMPTOM, not just by the
        title you have in mind — a task about your code is often named for the
        thing it broke:

            taskloom tasks list --all --format json | jq -r '.[]|select(.text|test("<symbol>"))|.harp_id'
            taskloom tasks list --term <symbol|path|error> --format json
            taskloom tasks list --tag-query <area>

        A duplicate is worse than a missing task: two rows describing one
        problem drift apart, and whichever is read first looks complete.

        ## Carry REASONING, not detail that rots

        The first line of a task's text is its SUBJECT (what the task IS, in
        ~80 characters: lists show only that line); provenance goes on a
        later line.

        A task earns its length with judgment a later reader cannot recompute.
        Write three things: WHY IT MATTERS, WHAT NEEDS TO HAPPEN, and WHAT
        WOULD SETTLE IT.

        Leave out line counts, commit SHAs, exhaustive file inventories, census
        numbers and measured sizes. Nothing recomputes them, so they go stale
        and then keep their authority while lying. Cite by SYMBOL — a function,
        a type, an exact string to grep — which fails loudly the moment someone
        looks for it; a stale line number silently points at unrelated code and
        gets believed.

        The reader has no memory of the session that proposed it and cannot ask
        you. That argues for the reasoning being stated once and clearly, not
        for an exhaustive body.

        LINK RELATED WORK with `relates:<harp>`, on both rows. Prose that says
        "see <harp>" is invisible to a query, so the connection exists only for
        whoever happens to read that paragraph. A split, a root cause and its
        symptom, a decision and the work it gates — link them, or the second one
        gets solved twice.

        ## The tag axes, and what each one answers

        Independent axes, each answering a different question. Conflating them is
        what makes a log unqueryable;
        the full rules live in `docs/task-tagging-standard.md`.

        - `triage:level=` — how bad is it if we ship without this, as an
          INTEGER 1-5, lower is worse. `1` data loss, or a trust/isolation
          boundary breached. `2` unusable, or SUCCEEDS WITHOUT DOING THE THING.
          `3` wrong, but a workaround exists. `4` low or no user impact. `5`
          does not exist yet. Security is folded in BY CONSEQUENCE — there is
          no second security scale to cross-reference.
          It is an integer so it SORTS and so relational queries work:
          `--tag-query 'triage:level<=2'` is everything that must not ship.
          Exactly one per task; the range is enforced, so `0` and `6` are
          refused.
        - `area:` — which subsystem. Exactly one per task.
        - `human:` — why a PERSON is needed: `decision`, `voice`, `authority`,
          `verify`, `prerequisite` or `action`. Repeatable. Never the flat
          `human`: it said where a row went, never why.
        - `triage:blocks-release=<semver>` — the one way to say a release
          waits on this. No `release`, version or milestone tags.
        - `icebox` — a known possibility, deliberately unscheduled: what is
          built is good enough as it is, and this is built only when someone
          REQUESTS it. A flat tag. Pair it with status `Deferred` and a
          `--trigger` naming who or what would request it. (Prior art:
          Pivotal Tracker's Icebox; Linear's Icebox status in Backlog.)
        - `someday-maybe` — not committed: it is uncertain whether it is
          wanted at all. Weaker than `icebox`, which says "we would do it if
          asked"; this says "we might not want it". A flat tag; also
          `Deferred`, its `--trigger` the decision or evidence that would show
          it is wanted. (Prior art: GTD's Someday/Maybe list.) Both flags are
          seeded in every new store; a store made before them admits them
          once a person runs `taskloom manage schema permits add`.
        - `touches:` — a repo-relative FILE path this task will EDIT.
          Repeatable. This is what says whether two tasks can run at once: two
          agents editing one file collide whatever symbols each touched.
        - `sig:` — `package.Symbol` whose contract changes. Repeatable.

        `touches:` and `sig:` are the two pieces of location that SURVIVE the
        rule against rotting detail, and they survive for different reasons.
        `sig:` is a symbol: when it goes stale a grep returns nothing and the
        reader finds out immediately. `touches:` is the only thing that answers
        whether two tasks can be dispatched at once — drop it and a scheduler
        has to open every row to find out. Neither is an inventory of the
        change: record what is already in front of you and stop. Do not
        "simplify" them away as detail; they are the deliberate exception, and
        this paragraph is the reason.

        Tags are `(namespace:)key(=value)`. Before choosing one, read
        `taskloom manage schema show --format json` (enums, ranges and scalar
        targets, enforced on write), `taskloom manage schema tags list
        --format json` (what is in use) and `taskloom manage schema permits
        list --format json`. Where the project declares tag permits, a tag they
        do not permit is REFUSED on write: choose a permitted tag that says
        the same thing, or propose the one you need to the human. Never coin
        a near-twin that happens to pass.

        Agents must not run `taskloom manage schema declare`, `taskloom manage
        schema permits add|remove` or `taskloom manage migrate schema` without
        explicit permission from the human for that specific change — they
        change the store's tag rules, agents can widen them and frequently
        will; ask first. Reading the rules (`taskloom manage schema
        show`, `export` and `check`) needs no permission. Changes preview by
        default: `--yes` applies them, `--dry-run` never does.

        Rate the level FROM THE CODE, never from the task's own prose: a task
        description outlives the code it describes, and tasks here have named
        functions deleted commits earlier.

        When you rename a file or change a symbol's contract, fix the
        `touches:`/`sig:` tags that name it. Nothing else will: a tag has no
        compiler and no gate.

        Both halves matter for the same reason: a task nobody rereads gets
        solved twice, and a task silently satisfied but left open is
        indistinguishable from work never done.

        ## Plan stamping

        When you edit a plan file (`*.plan.md`), the active session's harp
        name is auto-stamped into the file's YAML frontmatter `sessions:`
        list. Plans and sessions cross-reference without a separate
        database. A plan is that file: its frontmatter holds its id, title,
        status, tags and the tasks it governs (`taskloom plans list
        --governs <harp>` finds a task's plans).
