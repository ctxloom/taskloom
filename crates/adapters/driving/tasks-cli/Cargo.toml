[package]
name = "tasks-cli"
version = "0.1.0"
description = "The tasks command line: arguments parsed into use cases, and their answers rendered as text or JSON"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-embedded-diagnostic.workspace = true
clap.workspace = true
presentation.workspace = true
serde.workspace = true
tasks-application.workspace = true
tasks-presentation.workspace = true

[dev-dependencies]
# Rendering catalogs' English, for the tests that hold it to Go's.
fluent-bundle.workspace = true
fluent-syntax.workspace = true
serde_json.workspace = true

[features]
# `diagnostic_samples`, for other crates' catalog tests: their
# dev-dependency turns it on, and no build of a binary does.
test-support = []

[lints]
workspace = true
