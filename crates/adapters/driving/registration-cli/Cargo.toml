[package]
name = "registration-cli"
version = "0.1.0"
description = "The manage command group (install, uninstall, check), for any binary to mount: Go taskloom's flags parsed into the registration use cases, and their answers rendered as text or JSON"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-embedded-diagnostic.workspace = true
clap.workspace = true
# Flavor: how a notice names a variable ($PATH, or %PATH% on Windows).
os.workspace = true
presentation.workspace = true
registration-application.workspace = true
serde.workspace = true

[dev-dependencies]
# Rendering catalogs' English, for the tests that hold it to Go's.
fluent-bundle.workspace = true
fluent-syntax.workspace = true
mutants.workspace = true
ports.workspace = true
serde_json.workspace = true

[features]
# `diagnostic_samples`, for other crates' catalog tests: their
# dev-dependency turns it on, and no build of a binary does.
test-support = []

[lints]
workspace = true
