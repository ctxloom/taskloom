[package]
name = "plans-cli"
version = "0.1.0"
description = "The plan command group (add, list, show, status, link, unlink, check, import), for any binary to mount: arguments parsed into the plans use cases, and their answers rendered as text or JSON"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-diagnostic.workspace = true
clap.workspace = true
plans-application.workspace = true
angzarr-presentation.workspace = true
serde.workspace = true

[dev-dependencies]
# The test support's block_on_ready.
angzarr-embedded = { workspace = true, features = ["test-support"] }
fluent-syntax.workspace = true
# Its `dead_letter_sample`, a letter for the tests to say.
plans-application = { workspace = true, features = ["test-support"] }
serde_json.workspace = true

[features]
# `diagnostic_samples`, for other crates' catalog tests: their
# dev-dependency turns it on, and no build of a binary does.
test-support = []

[lints]
workspace = true
