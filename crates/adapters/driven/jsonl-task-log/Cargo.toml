[package]
name = "jsonl-task-log"
version = "0.1.0"
description = "Go taskloom's per-project task logs (~/.ctxloom/tasks/<project-id>.jsonl), read behind the JsonlTaskLogs port"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
prost-types.workspace = true
angzarr-embedded-diagnostic.workspace = true
file-system.workspace = true
# Flavor: which variable the home is read from, for the no-home error.
os.workspace = true
ports.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true

[dev-dependencies]
# Rendering catalogs' English, for the tests that hold it to Go's.
fluent-bundle.workspace = true
fluent-syntax.workspace = true
os = { workspace = true, features = ["test-support"] }

[features]
# `diagnostic_samples`, for other crates' catalog tests: their
# dev-dependency turns it on, and no build of a binary does.
test-support = []

[lints]
workspace = true
