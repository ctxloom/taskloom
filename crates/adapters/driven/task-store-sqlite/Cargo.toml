[package]
name = "task-store-sqlite"
version = "0.1.0"
description = "A project's task store: angzarr-store-sqlite's SQLite store at the project's path, behind the TaskStores port, and its integrity check behind StoreCheck"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-diagnostic.workspace = true
# The store: angzarr-store-sqlite, through angzarr-embedded's re-export
# (its `sqlite` feature), at the rev the kernel is built with.
angzarr-embedded = { workspace = true, features = ["sqlite"] }
angzarr-ports.workspace = true
file-system.workspace = true
os.workspace = true
ports.workspace = true
# A runtime of the check's own: StoreCheck is synchronous, as the project
# commands are, and its caller may be on a runtime already.
tokio.workspace = true

[dev-dependencies]
fluent-syntax.workspace = true
# The embedded store's test pages: their payloads and instants.
prost-types.workspace = true
os = { workspace = true, features = ["test-support"] }

[build-dependencies]
# The build writes the catalog's source under the crate's name
# (angzarr_diagnostic::build): no catalog spells its crate's name.
angzarr-diagnostic = { workspace = true, features = ["build"] }

[features]
# `diagnostic_samples`, for other crates' catalog tests: their
# dev-dependency turns it on, and no build of a binary does.
test-support = []

[lints]
workspace = true
