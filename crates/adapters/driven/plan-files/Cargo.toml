[package]
name = "plan-files"
version = "0.1.0"
description = "The work tree's plan files through the file-system seam, behind the PlanFiles port"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-embedded-diagnostic.workspace = true
file-system.workspace = true
os.workspace = true
ports.workspace = true

[dev-dependencies]
fluent-syntax.workspace = true
file-system = { workspace = true, features = ["test-support"] }
os = { workspace = true, features = ["test-support"] }

[features]
# `diagnostic_samples`, for other crates' catalog tests: their
# dev-dependency turns it on, and no build of a binary does.
test-support = []

[lints]
workspace = true
