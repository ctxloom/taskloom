[package]
name = "task-lists"
version = "0.1.0"
description = "Task lists: read models a projector folds from a project's task streams"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
annals.workspace = true
# The list on angzarr-embedded (`embedded`), beside the annals one until the
# application moves (step 4 of taskloom-on-angzarr-embedded.plan.md).
angzarr-embedded.workspace = true
tasks.workspace = true

[dev-dependencies]
# The in-memory store the embedded list's tests run the kernel over.
angzarr-ports = { workspace = true, features = ["memory"] }

[lints]
workspace = true
