[package]
name = "plans-application"
version = "0.1.0"
description = "The plans use cases: add, status, link, list, show, check and the import of ctxloom:plan tags, over the ports and angzarr-embedded's kernel"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-embedded.workspace = true
angzarr-diagnostic.workspace = true
plan-lists.workspace = true
plans.workspace = true
ports.workspace = true
sha2.workspace = true
# Each command run through the kernel, as every context runs one.
kernel-runner.workspace = true
# The tasks use cases, which the project's tasks are read and retagged
# through (`ProjectTasks`, the `Tasks` port over them).
tasks-application.workspace = true

[dev-dependencies]
# The test support the fakes share: the kernel's (`angzarr_embedded::testing`:
# block_on_ready, angzarr-ports' FaultyStore) and the ports' (`ports::testing`:
# the clock and the delay).
angzarr-embedded = { workspace = true, features = ["test-support"] }
ports = { workspace = true, features = ["test-support"] }
fluent-syntax.workspace = true
# `#[cfg_attr(test, mutants::skip)]`, for a mutant judged equivalent.
mutants.workspace = true

[features]
# `diagnostic_samples` and `dead_letter_sample`, for other crates' tests:
# their dev-dependency turns it on, and no build of a binary does.
test-support = []

[lints]
workspace = true
