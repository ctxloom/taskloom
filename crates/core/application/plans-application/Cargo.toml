[package]
name = "plans-application"
version = "0.1.0"
description = "The plans use cases over plan files: list, show, add, set, tag, link, unlink, check and the watch's snapshots, with the frontmatter edited in place, over the ports"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-diagnostic.workspace = true
# The editor that changes a frontmatter in place, keeping every byte the
# edit does not touch (as tasks-config edits the config file).
angzarr-yaml.workspace = true
ports.workspace = true
# A plan's tags are held to the store's rules as a task's are, by the
# crate they share.
tag-rules.workspace = true
tagma-core.workspace = true
# The tasks use cases, which the project's tasks and rules are read
# through (`ProjectTasks`, the `Tasks` port over them).
tasks-application.workspace = true

[dev-dependencies]
fluent-syntax.workspace = true
# `#[cfg_attr(test, mutants::skip)]`, for a mutant judged equivalent.
mutants.workspace = true
# The test support the fakes share: the kernel's block_on_ready.
angzarr-embedded = { workspace = true, features = ["test-support"] }
tag-rules = { workspace = true, features = ["test-support"] }
ports = { workspace = true, features = ["test-support"] }

[build-dependencies]
# The build writes the catalog's source under the crate's name
# (angzarr_diagnostic::build): no catalog spells its crate's name.
angzarr-diagnostic = { workspace = true, features = ["build"] }

[features]
# `diagnostic_samples`, for other crates' tests: their dev-dependency turns
# it on, and no build of a binary does.
test-support = []

[lints]
workspace = true
