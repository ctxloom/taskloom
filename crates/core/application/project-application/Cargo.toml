[package]
name = "project-application"
version = "0.1.0"
description = "The project use cases: show what a directory's identity rests on, heal its skew and check its database for damage, repoint it, and list and remove orphaned databases"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-diagnostic.workspace = true
ports.workspace = true

[dev-dependencies]
# Rendering catalogs' English (`english_for!`), for the tests that hold it
# to Go's.
angzarr-presentation = { workspace = true, features = ["test-support"] }
fluent-syntax.workspace = true

[build-dependencies]
# The build writes the catalog's source under the crate's name
# (angzarr_diagnostic::build): no catalog spells its crate's name.
angzarr-diagnostic = { workspace = true, features = ["build"] }

[features]
# `diagnostic_samples`, for other crates' catalog tests: their
# dev-dependency turns it on, and no build of a binary does.
test-support = []

[lints]
workspace = true
