[package]
name = "tasks"
version = "0.1.0"
description = "The tasks domain: one task per aggregate, decided and folded on angzarr-embedded (TaskAggregate)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The task aggregate on angzarr-embedded's markup (`TaskAggregate`).
angzarr-embedded.workspace = true
angzarr-embedded-diagnostic.workspace = true
angzarr-embedded-macros.workspace = true
# The generated domain layer names prost::Name and the wire types.
prost.workspace = true
tagma-core.workspace = true
tagma-proto.workspace = true
tasks-proto.workspace = true

[build-dependencies]
angzarr-build.workspace = true
# Only for the directory tagma/v1/tag.proto is imported from.
tagma-proto.workspace = true

[dev-dependencies]
# The in-memory store the aggregate's tests run the kernel over.
angzarr-ports = { workspace = true, features = ["memory"] }
fluent-syntax = "0.11"
mutants.workspace = true

[lints]
workspace = true
